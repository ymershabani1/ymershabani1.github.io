<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>K-AKS | Zgjidh versionin</title>
  <style>
    @font-face {
      font-family: "Chakra Petch";
      src: url("assets/fonts/ChakraPetch-Bold.ttf") format("truetype");
      font-weight: 700;
    }
    @font-face {
      font-family: "Oxanium";
      src: url("assets/fonts/Oxanium-Regular.ttf") format("truetype");
      font-weight: 400;
    }
    :root {
      --navy: #102b4e;
      --lime: #b3ce35;
      --white: #fff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        linear-gradient(135deg, rgba(16, 43, 78, 0.92), rgba(16, 43, 78, 0.75)),
        url("assets/img/hero-slide-1.jpg") center/cover no-repeat;
      font-family: "Oxanium", sans-serif;
      color: var(--white);
      padding: 32px;
    }
    .chooser {
      width: min(720px, 100%);
      text-align: center;
    }
    .chooser img {
      height: 64px;
      width: auto;
      margin: 0 auto 28px;
      display: block;
      filter: brightness(0) invert(1);
    }
    h1 {
      font-family: "Chakra Petch", sans-serif;
      font-size: clamp(32px, 5vw, 48px);
      margin: 0 0 36px;
      line-height: 1.1;
    }
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    a {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 140px;
      text-decoration: none;
      color: var(--navy);
      background: var(--white);
      border: 2px solid transparent;
      font-family: "Chakra Petch", sans-serif;
      font-size: clamp(22px, 3vw, 28px);
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    a:hover {
      transform: translateY(-4px);
      border-color: var(--lime);
    }
    @media (max-width: 640px) {
      .actions { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="chooser">
    <img src="assets/img/logo.svg" alt="K-AKS" />
    <h1>Zgjidh versionin e dizajnit</h1>
    <div class="actions">
      <a href="/v1/">VERSION 1</a>
      <a href="/v2/">VERSION 2</a>
    </div>
  </div>
</body>
</html>
